# PostgreSQL для разработки. Нужен Docker Desktop.
#   docker compose up -d
# Затем в .env:
#   DATABASE_URL=postgresql+asyncpg://jobready:jobready@localhost:5432/jobready
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: jobready
      POSTGRES_PASSWORD: jobready
      POSTGRES_DB: jobready
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobready"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
